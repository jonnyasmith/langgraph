[project]
name = "router"
version = "0.1.0"
description = "Deterministic state machine that routes a prompt to the cheapest model that can answer it"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "anthropic>=0.75",
    "langchain-anthropic>=1.0",
    "langchain-core>=1.5",
    "langchain-ollama>=1.0",
    "ollama>=0.6",
    "langgraph>=1.0",
]

[dependency-groups]
dev = [
    "mypy>=1.18",
    "pytest>=8.4",
    "ruff>=0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/router"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
    "RUF",  # ruff-specific
]

[tool.mypy]
python_version = "3.14"
files = ["src", "tests"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -m 'not live'"
markers = [
    "live: performs a real model call; needs a served local model or an API key and costs money",
]
